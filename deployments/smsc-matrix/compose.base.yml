# Base compose for SMSC Gateway integration testing.
#
# Topology:
#   Python tests (smpplib) --> smsc-gateway:2776 --> downstream SMSC:2775
#
# Usage:
#   # With our mock-smsc (fastest, always available):
#   docker compose -f compose.base.yml -f compose.mocksmsc.yml up -d
#
#   # With SMPPSim:
#   docker compose -f compose.base.yml -f compose.smppsim.yml up -d
#
#   # Run tests:
#   cd ../../tests/smsc-gateway && pip install -r requirements.txt
#   GW_HOST=127.0.0.1 GW_PORT=2776 pytest -v

services:
  smsc-gateway:
    build:
      context: ../..
      dockerfile: cmd/smsc-gateway/Dockerfile
    ports:
      - "2776:2776"
      - "9092:9090"
    environment:
      GW_LISTEN_ADDR: ":2776"
      GW_SMSC_HOST: downstream-smsc
      GW_SMSC_PORT: "2775"
      GW_SMSC_SYSTEM_ID: smppclient
      GW_SMSC_PASSWORD: password
      GW_POOL_CONNECTIONS: "2"
      GW_POOL_WINDOW_SIZE: "10"
      GW_DATA_DIR: /data/smscgw
      GW_SERVER_PASSWORD: password
      GW_RECONNECT_GRACE_SEC: "30"
      GW_MAX_SUBMIT_RETRIES: "3"
      GW_SUBMIT_RETRY_INTERVAL_SEC: "5"
      GW_ENQUIRE_LINK_SEC: "15"
      GW_IDLE_TIMEOUT_SEC: "120"
      GW_DRAIN_TIMEOUT_SEC: "10"
      GW_RATE_LIMIT_TPS: "0"
      LOG_LEVEL: debug
    volumes:
      - smscgw-data:/data/smscgw
    depends_on:
      downstream-smsc:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2776 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smscgw-data:
