services:
  kafka-init:
    environment:
      KAFKA_TOPIC_PARTITIONS: "64"
      KAFKA_RETENTION_MS_TRANSIENT: "21600000"
      KAFKA_RETENTION_MS_STATE: "86400000"

  ota-api:
    environment:
      CAMPAIGN_SHARD_SIZE: "5000"
      DB_MAX_OPEN_CONNS: "12"
      DB_MAX_IDLE_CONNS: "4"
      KAFKA_PRODUCER_BATCH_SIZE: "10000"
      KAFKA_PRODUCER_BATCH_TIMEOUT_MS: "100"
      KAFKA_CONSUMER_QUEUE_CAPACITY: "10000"

  campaign-planner:
    environment:
      PLANNER_CLAIM_BATCH_SIZE: "5000"
      PLANNER_POLL_INTERVAL_MS: "250"
      DB_MAX_OPEN_CONNS: "8"
      DB_MAX_IDLE_CONNS: "2"
      KAFKA_PRODUCER_BATCH_SIZE: "10000"
      KAFKA_PRODUCER_BATCH_TIMEOUT_MS: "100"
      KAFKA_CONSUMER_QUEUE_CAPACITY: "10000"

  card-executor:
    environment:
      EXECUTOR_ACTIVATE_RUNNERS: "2"
      EXECUTOR_DLR_RUNNERS: "2"
      EXECUTOR_MO_RUNNERS: "2"
      DB_MAX_OPEN_CONNS: "16"
      DB_MAX_IDLE_CONNS: "8"
      SCYLLA_NUM_CONNS: "4"
      COORDINATION_POOL_SIZE: "50"
      KAFKA_PRODUCER_BATCH_SIZE: "10000"
      KAFKA_PRODUCER_BATCH_TIMEOUT_MS: "10"
      GOMEMLIMIT: "2GiB"

  read-model-projector:
    environment:
      PROJECTOR_WORKERS: "32"
      PROJECTOR_FLUSH_WORKERS: "8"
      PROJECTOR_BATCH_SIZE: "500"
      PROJECTOR_UPDATE_BATCH_SIZE: "500"
      PROJECTOR_FLUSH_INTERVAL_MS: "100"
      SCYLLA_NUM_CONNS: "4"
      KAFKA_CONSUMER_QUEUE_CAPACITY: "10000"

  sms-gateway:
    environment:
      SMS_SENDER_WORKERS: "8"
      SMPP_CONNECTIONS: "12"
      SMPP_WINDOW_SIZE: "200"
      SMPP_DELIVER_WORKERS: "8"
      SPOOL_PROCESSOR_WORKERS: "32"
      SCYLLA_NUM_CONNS: "4"
      COORDINATION_POOL_SIZE: "50"
      KAFKA_PRODUCER_BATCH_SIZE: "10000"
      KAFKA_PRODUCER_BATCH_TIMEOUT_MS: "10"
      KAFKA_CONSUMER_QUEUE_CAPACITY: "10000"
      GOMEMLIMIT: "1GiB"

  mock-smsc:
    environment:
      DLR_DELAY_MS: "10"
      MO_DELAY_MS: "10"

  reconciler:
    environment:
      DB_MAX_OPEN_CONNS: "2"
      DB_MAX_IDLE_CONNS: "1"
      KAFKA_CONSUMER_QUEUE_CAPACITY: "10000"
