services:
  kafka-init:
    environment:
      KAFKA_TOPIC_PARTITIONS: "64"
      KAFKA_RETENTION_MS_TRANSIENT: "21600000"
      KAFKA_RETENTION_MS_STATE: "86400000"

  ota-api:
    environment:
      CAMPAIGN_SHARD_SIZE: "5000"
      DB_MAX_OPEN_CONNS: "12"
      DB_MAX_IDLE_CONNS: "4"
      KAFKA_PRODUCER_BATCH_SIZE: "10000"
      KAFKA_PRODUCER_BATCH_TIMEOUT_MS: "100"
      KAFKA_CONSUMER_QUEUE_CAPACITY: "10000"

  campaign-planner:
    environment:
      PLANNER_CLAIM_BATCH_SIZE: "5000"
      PLANNER_POLL_INTERVAL_MS: "100"
      DB_MAX_OPEN_CONNS: "8"
      DB_MAX_IDLE_CONNS: "2"
      KAFKA_PRODUCER_BATCH_SIZE: "10000"
      KAFKA_PRODUCER_BATCH_TIMEOUT_MS: "100"
      KAFKA_CONSUMER_QUEUE_CAPACITY: "10000"

  card-executor:
    environment:
      CARD_WORKER_CONCURRENCY: "32"
      CARD_MO_WORKERS: "80"
      DB_MAX_OPEN_CONNS: "32"
      DB_MAX_IDLE_CONNS: "16"
      CARD_KEY_CACHE_SIZE: "100000"
      KAFKA_PRODUCER_BATCH_SIZE: "10000"
      KAFKA_PRODUCER_BATCH_TIMEOUT_MS: "10"
      KAFKA_CONSUMER_QUEUE_CAPACITY: "10000"

  read-model-projector:
    environment:
      PROJECTOR_WORKERS: "32"
      PROJECTOR_FLUSH_WORKERS: "16"
      PROJECTOR_BATCH_SIZE: "500"
      PROJECTOR_UPDATE_BATCH_SIZE: "500"
      PROJECTOR_FLUSH_INTERVAL_MS: "100"
      KAFKA_CONSUMER_QUEUE_CAPACITY: "10000"

  sms-gateway:
    environment:
      SMS_SENDER_WORKERS: "64"
      SMPP_CONNECTIONS: "12"
      SMPP_WINDOW_SIZE: "20"
      SMPP_DELIVER_WORKERS: "16"
      KAFKA_PRODUCER_BATCH_SIZE: "10000"
      KAFKA_PRODUCER_BATCH_TIMEOUT_MS: "10"
      KAFKA_CONSUMER_QUEUE_CAPACITY: "10000"

  reconciler:
    environment:
      DB_MAX_OPEN_CONNS: "2"
      DB_MAX_IDLE_CONNS: "1"
      KAFKA_CONSUMER_QUEUE_CAPACITY: "10000"
