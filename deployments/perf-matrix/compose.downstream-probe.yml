# Downstream controllable probe for correctness and failure benchmarking.
#
# Exposes:
# - SMPP on 2775
# - HTTP control API on 8085

services:
  central-sut:
    environment:
      GW_POOL_CONNECTIONS: "1"

  downstream-smsc:
    build:
      context: ../..
      dockerfile: cmd/smpp-probe-smsc/Dockerfile
    ports:
      - "2775:2775"
      - "8085:8080"
    environment:
      PROBE_SMPP_PORT: "2775"
      PROBE_HTTP_PORT: "8080"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2775 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
