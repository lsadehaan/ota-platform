global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "central-sut"
    static_configs:
      - targets: ["central-sut:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
