services:
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ota
      POSTGRES_PASSWORD: ota_secret
      POSTGRES_DB: ota_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ota"]
      interval: 10s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  scylla:
    image: scylladb/scylla:6.1
    command: --smp 1 --memory 1G --overprovisioned 1 --api-address 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "nodetool status > /dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  db-migrate:
    build:
      context: ..
      dockerfile: cmd/db-migrate/Dockerfile
    environment:
      DATABASE_URL: postgres://ota:ota_secret@postgres:5432/ota_platform?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  kafka-init:
    build:
      context: ..
      dockerfile: cmd/kafka-init/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_PARTITIONS: "12"
      KAFKA_TOPIC_REPLICATION_FACTOR: "1"
    depends_on:
      kafka:
        condition: service_healthy

  ota-api:
    build:
      context: ..
      dockerfile: cmd/ota-api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://ota:ota_secret@postgres:5432/ota_platform?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTA_API_PORT: "8080"
      COORDINATION_ADDR: dragonfly:6379
      SCYLLA_HOSTS: scylla
      SCYLLA_KEYSPACE: ota_execution
      ALLOWED_ORIGINS: http://localhost:3001,http://10.100.0.1:3001
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      scylla:
        condition: service_healthy

  campaign-planner:
    build:
      context: ..
      dockerfile: cmd/campaign-planner/Dockerfile
    environment:
      DATABASE_URL: postgres://ota:ota_secret@postgres:5432/ota_platform?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  card-executor:
    build:
      context: ..
      dockerfile: cmd/card-executor/Dockerfile
    environment:
      DATABASE_URL: postgres://ota:ota_secret@postgres:5432/ota_platform?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      COORDINATION_ADDR: dragonfly:6379
      SCYLLA_HOSTS: scylla
      SCYLLA_KEYSPACE: ota_execution
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      scylla:
        condition: service_healthy

  read-model-projector:
    build:
      context: ..
      dockerfile: cmd/read-model-projector/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      SCYLLA_HOSTS: scylla
      SCYLLA_KEYSPACE: ota_execution
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      scylla:
        condition: service_healthy

  reconciler:
    build:
      context: ..
      dockerfile: cmd/reconciler/Dockerfile
    environment:
      DATABASE_URL: postgres://ota:ota_secret@postgres:5432/ota_platform?sslmode=disable
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  sms-gateway:
    build:
      context: ..
      dockerfile: cmd/sms-gateway/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      SMPP_HOST: mock-smsc
      SMPP_PORT: "2775"
      SMPP_SYSTEM_ID: ota_user
      SMPP_PASSWORD: ota_pass
      SMPP_SOURCE_ADDR: "357"
      COORDINATION_ADDR: dragonfly:6379
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      mock-smsc:
        condition: service_started

  mock-smsc:
    build:
      context: ..
      dockerfile: cmd/mock-smsc/Dockerfile
    environment:
      SMSC_PORT: "2775"
      DLR_DELAY_MS: "50"
      DLR_SUCCESS_RATE: "1.0"
      ENABLE_MO: "true"
      MO_DELAY_MS: "25"
      MO_PAYLOAD_HEX: "000B0A01020300000000000000"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      INTERNAL_API_URL: http://ota-api:8080
      NEXT_PUBLIC_API_PORT: "8080"
    depends_on:
      - ota-api

volumes:
  pgdata:
