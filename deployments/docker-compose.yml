services:
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
    environment:
      POSTGRES_USER: ota
      POSTGRES_PASSWORD: ota_secret
      POSTGRES_DB: ota_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ota"]
      interval: 10s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  scylla:
    image: scylladb/scylla:6.1
    command: --smp 1 --memory 1G --overprovisioned 1 --api-address 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "nodetool status > /dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  db-migrate:
    build:
      context: ..
      dockerfile: cmd/db-migrate/Dockerfile
    environment:
      DATABASE_URL: postgres://ota:ota_secret@postgres:5432/ota_platform?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy

  kafka-init:
    build:
      context: ..
      dockerfile: cmd/kafka-init/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      KAFKA_TOPIC_PARTITIONS: "12"
      KAFKA_TOPIC_REPLICATION_FACTOR: "1"
    depends_on:
      kafka:
        condition: service_healthy

  ota-api:
    build:
      context: ..
      dockerfile: cmd/ota-api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://ota:ota_secret@postgres:5432/ota_platform?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTA_API_PORT: "8080"
      COORDINATION_ADDR: dragonfly:6379
      SCYLLA_HOSTS: scylla
      SCYLLA_KEYSPACE: ota_execution
      ALLOWED_ORIGINS: http://localhost:3001,http://10.100.0.1:3001
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      scylla:
        condition: service_healthy

  campaign-planner:
    build:
      context: ..
      dockerfile: cmd/campaign-planner/Dockerfile
    environment:
      DATABASE_URL: postgres://ota:ota_secret@postgres:5432/ota_platform?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  card-executor:
    build:
      context: ..
      dockerfile: cmd/card-executor/Dockerfile
    environment:
      DATABASE_URL: postgres://ota:ota_secret@postgres:5432/ota_platform?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      COORDINATION_ADDR: dragonfly:6379
      SCYLLA_HOSTS: scylla
      SCYLLA_KEYSPACE: ota_execution
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      scylla:
        condition: service_healthy

  read-model-projector:
    build:
      context: ..
      dockerfile: cmd/read-model-projector/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      SCYLLA_HOSTS: scylla
      SCYLLA_KEYSPACE: ota_execution
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      scylla:
        condition: service_healthy

  reconciler:
    build:
      context: ..
      dockerfile: cmd/reconciler/Dockerfile
    environment:
      DATABASE_URL: postgres://ota:ota_secret@postgres:5432/ota_platform?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  sms-gateway:
    build:
      context: ..
      dockerfile: cmd/sms-gateway/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      SMPP_HOST: mock-smsc
      SMPP_PORT: "2775"
      SMPP_SYSTEM_ID: ota_user
      SMPP_PASSWORD: ota_pass
      SMPP_SOURCE_ADDR: "357"
      COORDINATION_ADDR: dragonfly:6379
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      mock-smsc:
        condition: service_started

  mock-smsc:
    build:
      context: ..
      dockerfile: cmd/mock-smsc/Dockerfile
    environment:
      SMSC_PORT: "2775"
      DLR_DELAY_MS: "50"
      DLR_SUCCESS_RATE: "1.0"
      ENABLE_MO: "true"
      MO_DELAY_MS: "25"
      MO_PAYLOAD_HEX: "000B0A01020300000000000000"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      INTERNAL_API_URL: http://ota-api:8080
      NEXT_PUBLIC_API_PORT: "8080"
      NEXT_PUBLIC_GRAFANA_URL: http://localhost:3002
    depends_on:
      - ota-api

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command:
      - --kafka.server=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://ota:ota_secret@postgres:5432/ota_platform?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    volumes:
      - ./observability/postgres-exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus-config:
    image: docker:27-cli
    user: "0:0"
    entrypoint: ["/bin/sh", "/scripts/generate-config.sh"]
    environment:
      COMPOSE_PROJECT_NAME: deployments
      PROMETHEUS_OUT: /out/prometheus.yml
    volumes:
      - ./observability/prometheus/generate-config.sh:/scripts/generate-config.sh:ro
      - prometheus-config:/out
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      ota-api:
        condition: service_started
      card-executor:
        condition: service_started
      sms-gateway:
        condition: service_started
      read-model-projector:
        condition: service_started
      campaign-planner:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "9464:9464"

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - prometheus-config:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      prometheus-config:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      cadvisor:
        condition: service_started

  grafana:
    image: grafana/grafana-oss:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3002:3000"
    depends_on:
      prometheus:
        condition: service_started

  toolbox:
    build:
      context: ..
      dockerfile: deployments/toolbox/Dockerfile
    profiles: ["tools"]
    working_dir: /workspace
    command: sleep infinity
    volumes:
      - ..:/workspace
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build

  seed-card-dataset-runner:
    build:
      context: ..
      dockerfile: deployments/toolbox/Dockerfile
    profiles: ["tools"]
    working_dir: /workspace
    entrypoint: ["sh", "-lc"]
    command: ["go run ./cmd/seed-card-dataset " ]
    volumes:
      - ..:/workspace
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build

  e2e-load-runner:
    build:
      context: ..
      dockerfile: deployments/toolbox/Dockerfile
    profiles: ["tools"]
    working_dir: /workspace
    entrypoint: ["sh", "-lc"]
    command: ["go run ./cmd/e2e-load-runner " ]
    volumes:
      - ..:/workspace
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build

  component-load-runner:
    build:
      context: ..
      dockerfile: deployments/toolbox/Dockerfile
    profiles: ["tools"]
    working_dir: /workspace
    entrypoint: ["sh", "-lc"]
    command: ["go run ./cmd/component-load-runner " ]
    volumes:
      - ..:/workspace
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build

volumes:
  pgdata:
  prometheus-config:
  gomodcache:
  gobuildcache:
